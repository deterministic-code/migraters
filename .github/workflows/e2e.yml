name: e2e

on:
  schedule:
    - cron: '0 21 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, rust, csharp]
        dialect: [sqlite, postgres, mysql, sqlserver, oracle]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Proof e2e
        run: |
          project="migraters-e2e-${{ matrix.language }}-${{ matrix.dialect }}"
          compose="proof/matrix/${{ matrix.language }}/${{ matrix.dialect }}/compose.yml"
          docker compose -p "$project" -f "$compose" up --build --abort-on-container-exit --exit-code-from e2e

      - name: Remove containers
        if: always()
        run: |
          project="migraters-e2e-${{ matrix.language }}-${{ matrix.dialect }}"
          compose="proof/matrix/${{ matrix.language }}/${{ matrix.dialect }}/compose.yml"
          docker compose -p "$project" -f "$compose" down -v --remove-orphans
