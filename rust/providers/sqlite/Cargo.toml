[package]
name = "migraters-sqlite"
version = "0.0.1"
edition = "2021"

[dependencies]
async-trait = "0.1"
inventory = "0.3"
migraters-api = { path = "../../api", version = "0.0.1" }
migraters-sql = { path = "../sql", version = "0.0.1" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt"] }
