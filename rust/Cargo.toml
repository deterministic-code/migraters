[package]
name = "deterministic-migraters"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "migrate-setup"
path = "src/bin/migrate_setup.rs"

[[bin]]
name = "migrate-up"
path = "src/bin/migrate_up.rs"

[[bin]]
name = "migrate-down"
path = "src/bin/migrate_down.rs"

[[bin]]
name = "migrate-create"
path = "src/bin/migrate_create.rs"

[dependencies]
dotenvy = "0.15"
migraters-api = { path = "api" }
tokio = { version = "1", features = ["full"] }
time = "=0.3.47"
sha2 = "0.10"
# migrate-init-dialects-start
# migrate-init-dialects-end

[dev-dependencies]
async-trait = "0.1"
