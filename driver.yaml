# Source of truth for the provider export every language implements.
# Casing follows the language: C# PascalCase, TypeScript camelCase, Rust snake_case.
# IMigrater, command argv, and help copy live in api.yaml and cli.yaml.
# SQL spelling, placeholders, quoting, and connections are provider details.

interface: IDatasourceProvider
methods:
  # Prepare storage. SQL providers create migrates and migrate_logs.
  - setup
  # Every recorded migration, name to checksum. Does not read migration files.
  - applied
  # Run one up body and record it. Args: connection, name, body, checksum.
  - migrateUp
  # Run one down body and forget it. Args: connection, name, body.
  - migrateDown
  # Args: connection, id, name, direction, status, duration, error.
  - log
