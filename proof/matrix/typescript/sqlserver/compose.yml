services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    tmpfs:
      - /var/opt/mssql
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Proof_Pass123
      MSSQL_PID: Developer
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Proof_Pass123" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "Proof_Pass123" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
  e2e:
    build:
      context: .
      args:
        MIGRATERS_SOURCE: ${MIGRATERS_SOURCE:-published}
    depends_on:
      sqlserver:
        condition: service_healthy
