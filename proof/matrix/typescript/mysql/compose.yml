services:
  mysql:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: proof
      MYSQL_DATABASE: proof
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pproof']
      interval: 5s
      timeout: 5s
      retries: 30
  e2e:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
