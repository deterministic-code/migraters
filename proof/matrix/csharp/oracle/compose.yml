services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: proof
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
  e2e:
    platform: linux/amd64
    build:
      context: .
      args:
        MIGRATERS_SOURCE: ${MIGRATERS_SOURCE:-published}
    depends_on:
      oracle:
        condition: service_healthy
