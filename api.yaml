# Source of truth for the library API every language implements.
# Command argv, aliases, exit codes, and help copy live in cli.yaml.
# SQL spelling, placeholders, quoting, and driver connections are provider details.

connection_environment: cli.yaml

interface: IMigrater
methods:
  - setup
  - up
  - down
  - create

providers:
  - sqlite
  - postgres
  - mysql
  - sqlserver
  - oracle
